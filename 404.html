<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages sirve esta página en cualquier ruta que no exista, así que el estilo va aquí
       dentro y los enlaces apuntan a la raíz del dominio ("/"). Si publicas como sitio de proyecto
       (usuario.github.io/repositorio/), cambia "/" por "/repositorio/" en los enlaces de abajo. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Weskitol</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light dark;
      --fondo: #f7f7f4;
      --superficie: #ffffff;
      --texto: #17181a;
      --texto-suave: #4b4d52;
      --borde: #d9d9d2;
      --enlace: #8a4600;
      --acento: #ffc53d;
      --sobre-acento: #17181a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #0f1012;
        --superficie: #18191c;
        --texto: #ededea;
        --texto-suave: #b3b4b0;
        --borde: #34353a;
        --enlace: #ffc53d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 30rem;
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 1.5rem 1.25rem;
      text-align: center;
    }
    .codigo {
      margin: 0;
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    h1 { font-size: 1.5rem; line-height: 1.25; margin: 0.75rem 0 0.5rem; }
    p { margin: 0 0 1rem; color: var(--texto-suave); }
    a { color: var(--enlace); text-underline-offset: 0.18em; }
    :focus-visible { outline: 3px solid var(--enlace); outline-offset: 2px; border-radius: 4px; }
    .boton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      background: var(--acento);
      color: var(--sobre-acento);
      font-weight: 700;
      text-decoration: none;
    }
    .enlaces { margin-top: 1.25rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <p class="codigo" aria-hidden="true">404</p>
    <h1>No encontramos esa página</h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no exista.</p>
    <a class="boton" href="/">Ir al inicio de Weskitol</a>
    <p class="enlaces"><a href="/privacidad.html">Política de privacidad</a> · <a href="/terminos.html">Términos de uso</a></p>
  </main>
</body>
</html>
